<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173b73" />
    <meta name="description" content="YKS öğrencileri için e-koçluk: görev, deneme, net, konu ve soru takibi." />
    <title>Öğrenci E-Koçluk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.childElementCount) {
          root.innerHTML = '<div style="font-family:sans-serif;padding:32px;max-width:40rem;line-height:1.5"><h1>Sayfa yüklenemedi</h1><p>Geliştirme sunucusu durmuş olabilir. Proje klasöründe <code>npm run dev</code> çalıştır, sonra bu sekmeyi yenile.</p></div>';
        }
      }, 4000);
    </script>
  </body>
</html>
